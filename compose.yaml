name: nodepass

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nodepass
      POSTGRES_USER: nodepass
      POSTGRES_PASSWORD: nodepass-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodepass -d nodepass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
