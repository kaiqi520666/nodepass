name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODEPASS_COOKIE_SECURE: "false"
  NODEPASS_ENVIRONMENT: development
  NODEPASS_WEB_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodepass_ci
          POSTGRES_USER: nodepass
          POSTGRES_PASSWORD: nodepass-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodepass -d nodepass_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODEPASS_TEST_DATABASE_URL: postgresql://nodepass:nodepass-ci-only@127.0.0.1:5432/postgres
      NODEPASS_DATABASE_URL: postgresql+psycopg://nodepass:nodepass-ci-only@127.0.0.1:5432/nodepass_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Generate test secrets
        working-directory: backend
        run: |
          echo "NODEPASS_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NODEPASS_CREDENTIALS_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: backend
        run: uv run pytest -q

      - name: Check migrations
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodepass_ci
          POSTGRES_USER: nodepass
          POSTGRES_PASSWORD: nodepass-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodepass -d nodepass_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODEPASS_DATABASE_URL: postgresql+psycopg://nodepass:nodepass-ci-only@127.0.0.1:5432/nodepass_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate test secrets
        working-directory: backend
        run: |
          echo "NODEPASS_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "NODEPASS_CREDENTIALS_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Migrate database
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start API
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/nodepass-api.log 2>&1 &
          echo $! > /tmp/nodepass-api.pid

      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nodepass-api.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

      - name: Show API log on failure
        if: failure()
        run: |
          if [ -f /tmp/nodepass-api.log ]; then
            cat /tmp/nodepass-api.log
          fi
