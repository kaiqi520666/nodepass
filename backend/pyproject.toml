[project]
name = "nodepass"
version = "0.1.0"
description = "NodePass API service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "cryptography>=46,<51",
    "oss2>=2.19,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
