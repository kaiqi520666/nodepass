<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NodePass 提供图片、视频生成与多模态文本 API，支持 OpenAI 兼容接口和按量计费。" />
    <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191c1e" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NodePass" />
    <meta property="og:title" content="NodePass · 图片、视频与多模态文本 API" />
    <meta property="og:description" content="一个 Key，调用图片生成与编辑、异步视频生成和多模态文本对话。OpenAI 兼容接口，按量计费。" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>NodePass · 图片、视频与多模态文本 API</title>
    <script>
      (() => {
        let mode = 'system'
        try {
          const saved = localStorage.getItem('nodepass.theme')
          if (['light', 'dark', 'system'].includes(saved)) mode = saved
        } catch {}
        const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.themeMode = mode
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
